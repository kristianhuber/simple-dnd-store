<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop Inventory</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <h1>Shop Inventory</h1>

  <div class="controls">
    <label>
      Store Type
      <select id="store-select"></select>
    </label>

    <label>
      Settlement Size
      <select id="size-select">
        <option value="Village">Village</option>
        <option value="Town">Town</option>
      </select>
    </label>

    <button type="button" id="reroll-specials-btn">Re-roll Specials</button>
  </div>

  <h2>Specials</h2>
  <table>
    <thead>
      <tr>
        <th>Item</th>
        <th>Price</th>
      </tr>
    </thead>
    <tbody id="specials-body"></tbody>
  </table>

  <h2>Basic Inventory</h2>
  <table>
    <thead>
      <tr>
        <th>Item</th>
        <th>Price</th>
      </tr>
    </thead>
    <tbody id="inventory-body"></tbody>
  </table>

  <script src="./app.js" defer></script>
</body>
</html>
